<!-- public/index.html -->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Browser voice assistant</title>
  </head>
  <body>
    <label>Voice
      <select id="voice">
        <option value="49c443a4-8a1d-5f7e-b70b-98bdbd9823c3">Audrey (American English)</option>
        <option value="aai-sara">Sara (American English)</option>
        <option value="aai-peter">Peter (American English)</option>
        <option value="aai-nancy">Nancy (British English)</option>
      </select>
    </label>
    <label>System prompt
      <textarea id="prompt">You are a friendly voice assistant. Keep replies to one or two short sentences.</textarea>
    </label>
    <button id="connect">Connect</button>
    <button id="hangup">Hang up</button>
    <p id="status">Idle</p>
    <div id="log"></div>
    <script type="module" src="app.js"></script>
  </body>
</html>
